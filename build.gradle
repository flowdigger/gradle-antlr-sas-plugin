plugins {
    id 'java'
    id 'antlr'
    id 'java-gradle-plugin'
    id 'com.gradle.plugin-publish' version '2.1.1'
    id 'jacoco'
    id 'org.flowdigger.gradle.antlr'
    id 'maven-publish'
    id 'signing'
}

group = 'org.flowdigger.gradle'
version = '1.0.0'

gradlePlugin {
    plugins {
        website = 'https://github.com/flowdigger/gradle-antlr-sas-plugin'
        vcsUrl = 'https://github.com/flowdigger/gradle-antlr-sas-plugin'
        sasGrammar {
            id = 'org.flowdigger.gradle.antlr.sas'
            implementationClass = 'org.flowdigger.gradle.antlr.SasGrammarPlugin'
            displayName = 'Gradle ANTLR SAS Plugin'
            description = 'Proof-of-concept SAS macro expansion and XML AST generation plugin.'
            tags.set(['antlr', 'sas', 'xml', 'ast', 'macro'])
        }
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
}

repositories {
    mavenCentral()
    gradlePluginPortal()
    mavenLocal()
}

dependencies {
    implementation("org.flowdigger.gradle:gradle-antlr-plugin:1.0.0")
    implementation 'org.antlr:antlr4-runtime:4.13.2'

    antlr 'org.antlr:antlr4:4.13.2'

    testImplementation gradleTestKit()
    testImplementation 'junit:junit:4.13.2'
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java

            pom {
                name = 'Gradle ANTLR SAS Plugin'
                description = 'Gradle plugin for XML AST conversion of SAS sources'
                url = 'https://github.com/flowdigger/gradle-antlr-sas-plugin'

                licenses {
                    license {
                        name = 'MIT License'
                        url = 'https://opensource.org/licenses/MIT'
                    }
                }

                signing {
                    required = { gradle.taskGraph.hasTask('publish') }
                    def signingKey = findProperty('signingKey')
                    def signingPassword = findProperty('signingPassword')
                    if (signingKey && signingPassword) {
                        useInMemoryPgpKeys(signingKey, signingPassword)
                        sign publishing.publications.mavenJava
                    }
                }

                developers {
                    developer {
                        id = 'flowdigger'
                        name = 'Flowdigger'
                    }
                }

                scm {
                    connection = 'scm:git:https://github.com/flowdigger/gradle-antlr-sas-plugin.git'
                    developerConnection = 'scm:git:ssh://git@github.com/flowdigger/gradle-antlr-sas-plugin.git'
                    url = 'https://github.com/flowdigger/gradle-antlr-sas-plugin'
                }
            }
        }
    }

    repositories {
        mavenLocal()
    }
}

generateGrammarSource {
    arguments += ['-listener', '-no-visitor']
}

sourceSets {
    main {
        antlr {
            srcDirs = ['src/main/antlr/org/flowdigger/parsers']
            include 'SasLexer.g4'
            include 'SasParser.g4'
            include 'CaslLexer.g4'
            include 'CaslParser.g4'
            include 'FedSqlLexer.g4'
            include 'FedSqlParser.g4'
            include 'Ds2Lexer.g4'
            include 'Ds2Parser.g4'
        }
        resources {
            srcDir 'src/main/antlr'
            include '**/*.g4'
        }
    }
}

tasks.named('javadoc', Javadoc) {
    source = fileTree('src/main/java') {
        include '**/*.java'
    }
}

tasks.named('compileJava') {
    dependsOn tasks.named('generateGrammarSource')
}

tasks.named('test') {
    useJUnit()
}

jacoco {
    toolVersion = '0.8.12'
}

tasks.named('jacocoTestReport') {
    dependsOn tasks.named('test')
    reports {
        xml.required = true
        html.required = true
    }
}

tasks.register('verifySampleSas', Exec) {
    group = 'verification'
    description = 'Runs SAS sample macro and XML AST tasks.'
    workingDir = projectDir
    commandLine './gradlew', '-p', 'samples/sas', 'clean', 'sasMacro', 'sasXmlAst'
}

tasks.register('verifySampleCasl', Exec) {
    group = 'verification'
    description = 'Runs CASL sample XML AST and semantic tasks.'
    workingDir = projectDir
    commandLine './gradlew', '-p', 'samples/casl', 'clean', 'caslXmlAst', 'caslSemantic'
}

tasks.register('verifySampleDs2', Exec) {
    group = 'verification'
    description = 'Runs DS2 sample XML AST and semantic tasks.'
    workingDir = projectDir
    commandLine './gradlew', '-p', 'samples/ds2', 'clean', 'ds2XmlAst', 'ds2Semantic'
}

tasks.register('verifySamples') {
    group = 'verification'
    description = 'Runs all sample verification task chains.'
    dependsOn tasks.named('verifySampleSas')
    dependsOn tasks.named('verifySampleCasl')
    dependsOn tasks.named('verifySampleDs2')
}

tasks.named('check') {
    dependsOn tasks.named('jacocoTestReport')
}

tasks.register('stageCentralBundleRepo', Sync) {
    dependsOn tasks.named('publishMavenJavaPublicationToMavenLocal')
    def artifactBaseDir = file("${System.getProperty('user.home')}/.m2/repository/org/flowdigger/gradle/gradle-antlr-sas-plugin")
    def artifactVersionDir = file("${artifactBaseDir}/${project.version}")
    from(artifactVersionDir)
    into(layout.buildDirectory.dir("central-staging-repo/org/flowdigger/gradle/gradle-antlr-sas-plugin/${project.version}"))

    doFirst {
        if (!artifactVersionDir.exists()) {
            throw new GradleException("Expected local Maven artifact version directory not found: ${artifactVersionDir}")
        }
    }
}

tasks.register('generateCentralBundleChecksums') {
    dependsOn tasks.named('stageCentralBundleRepo')

    doLast {
        def stagedVersionDir = layout.buildDirectory
                .dir("central-staging-repo/org/flowdigger/gradle/gradle-antlr-sas-plugin/${project.version}")
                .get()
                .asFile
        if (!stagedVersionDir.exists()) {
            throw new GradleException("Expected staged version directory not found: ${stagedVersionDir}")
        }

        def checksum = { File file, String algorithm ->
            def digest = java.security.MessageDigest.getInstance(algorithm)
            file.withInputStream { input ->
                byte[] buffer = new byte[8192]
                int read
                while ((read = input.read(buffer)) != -1) {
                    digest.update(buffer, 0, read)
                }
            }
            digest.digest().collect { String.format('%02x', it & 0xff) }.join('')
        }

        stagedVersionDir.eachFileRecurse { file ->
            if (file.isFile() && !file.name.endsWith('.md5') && !file.name.endsWith('.sha1')) {
                new File(file.parentFile, "${file.name}.md5").text = "${checksum(file, 'MD5')}\n"
                new File(file.parentFile, "${file.name}.sha1").text = "${checksum(file, 'SHA-1')}\n"
            }
        }
    }
}

tasks.register('packageCentralBundle', Zip) {
    dependsOn tasks.named('generateCentralBundleChecksums')
    archiveBaseName.set('gradle-antlr-sas-plugin')
    archiveVersion.set(project.version.toString())
    archiveClassifier.set('central-bundle')
    destinationDirectory.set(layout.buildDirectory.dir('central-bundle'))
    from(layout.buildDirectory.dir('central-staging-repo'))
}
