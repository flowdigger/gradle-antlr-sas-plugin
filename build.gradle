import java.security.MessageDigest

plugins {
    id 'java'
    id 'antlr'
    id 'java-gradle-plugin'
    id 'jacoco'
    id 'org.flowdigger.antlr' version '1.0.3'
    id 'maven-publish'
    id 'org.flowdigger.maven-publish'
        id 'checkstyle'
    id 'org.owasp.dependencycheck' version '13.0.0'
    id 'org.flowdigger.dependency-check'
    id 'com.github.spotbugs' version '6.1.0'
}

group = 'org.flowdigger.gradle'
version = '1.0.1'

checkstyle {
    toolVersion = '10.26.1'
    configFile = file('checkstyle.xml')
}

ext {
    spotbugsEngineVersion = '4.8.6'
    findSecBugsVersion = '1.13.0'
}

gradlePlugin {
    website = 'https://github.com/flowdigger/gradle-antlr-sas-plugin'
    vcsUrl = 'https://github.com/flowdigger/gradle-antlr-sas-plugin'
    plugins {
        sasGrammar {
            id = 'org.flowdigger.antlr.sas'
            implementationClass = 'org.flowdigger.gradle.antlr.SasGrammarPlugin'
            displayName = 'Gradle ANTLR SAS Plugin'
            description = 'Proof-of-concept SAS macro expansion and XML AST generation plugin.'
            tags.set(['antlr', 'sas', 'xml', 'ast', 'macro'])
        }
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
    withJavadocJar()
}

repositories {
    mavenCentral()
    mavenLocal()
}

dependencies {
    implementation("org.flowdigger.gradle:gradle-antlr-plugin:1.0.3")
    implementation 'org.antlr:antlr4-runtime:4.13.2'

    antlr 'org.antlr:antlr4:4.13.2'

    testImplementation gradleTestKit()
    testImplementation 'junit:junit:4.13.2'
    spotbugsPlugins "com.h3xstream.findsecbugs:findsecbugs-plugin:${findSecBugsVersion}"
}

publishing {
    publications.withType(MavenPublication).configureEach {
        pom {
            name = 'Gradle ANTLR SAS Plugin'
            description = 'Gradle plugin for XML AST conversion of SAS sources'
            url = 'https://github.com/flowdigger/gradle-antlr-sas-plugin'

            licenses {
                license {
                    name = 'MIT License'
                    url = 'https://opensource.org/licenses/MIT'
                }
            }

            developers {
                developer {
                    id = 'flowdigger'
                    name = 'Flowdigger'
                }
            }

            scm {
                connection = 'scm:git:https://github.com/flowdigger/gradle-antlr-sas-plugin.git'
                developerConnection = 'scm:git:ssh://git@github.com/flowdigger/gradle-antlr-sas-plugin.git'
                url = 'https://github.com/flowdigger/gradle-antlr-sas-plugin'
            }
        }
    }
}

def dependencyCheckSuppression = file('dependency-check-suppressions.xml')

spotbugs {
    toolVersion = spotbugsEngineVersion
    ignoreFailures = true
    effort = com.github.spotbugs.snom.Effort.valueOf('DEFAULT')
    reportLevel = com.github.spotbugs.snom.Confidence.valueOf('MEDIUM')
}

tasks.withType(com.github.spotbugs.snom.SpotBugsTask).configureEach {
    reports {
        html.required = true
        xml.required = false
    }
}

tasks.matching { it.name == 'spotbugsTest' }.configureEach {
    enabled = false
}

generateGrammarSource {
    arguments += ['-listener', '-no-visitor']
}

sourceSets {
    main {
        antlr {
            srcDirs = ['src/main/antlr/org/flowdigger/parsers']
            include 'SasLexer.g4'
            include 'SasParser.g4'
            include 'CaslLexer.g4'
            include 'CaslParser.g4'
            include 'FedSqlLexer.g4'
            include 'FedSqlParser.g4'
            include 'Ds2Lexer.g4'
            include 'Ds2Parser.g4'
        }
        resources {
            srcDir 'src/main/antlr'
            include '**/*.g4'
        }
    }
}

tasks.named('javadoc', Javadoc) {
    source = fileTree('src/main/java') {
        include '**/*.java'
    }
}

tasks.named('compileJava') {
    dependsOn tasks.named('generateGrammarSource')
}

tasks.named('test') {
    useJUnit()
}

jacoco {
    toolVersion = '0.8.12'
}

tasks.named('jacocoTestReport') {
    dependsOn tasks.named('test')
    reports {
        xml.required = true
        html.required = true
    }
}

tasks.register('coverage') {
    group = 'verification'
    description = 'Runs tests, generates JaCoCo report, and verifies minimum coverage threshold.'
    dependsOn tasks.named('jacocoTestReport')
}

tasks.register('verifySampleSas', Exec) {
    group = 'verification'
    description = 'Runs SAS sample macro and XML AST tasks.'
    workingDir = projectDir
    commandLine './gradlew', '-p', 'samples/sas', 'clean', 'sasMacro', 'sasXmlAst'
}

tasks.register('verifySampleCasl', Exec) {
    group = 'verification'
    description = 'Runs CASL sample XML AST and semantic tasks.'
    workingDir = projectDir
    commandLine './gradlew', '-p', 'samples/casl', 'clean', 'caslXmlAst', 'caslSemantic'
}

tasks.register('verifySampleDs2', Exec) {
    group = 'verification'
    description = 'Runs DS2 sample XML AST and semantic tasks.'
    workingDir = projectDir
    commandLine './gradlew', '-p', 'samples/ds2', 'clean', 'ds2XmlAst', 'ds2Semantic'
}

tasks.register('verifySamples') {
    group = 'verification'
    description = 'Runs all sample verification task chains.'
    dependsOn tasks.named('verifySampleSas')
    dependsOn tasks.named('verifySampleCasl')
    dependsOn tasks.named('verifySampleDs2')
}

tasks.named('check') {
    dependsOn tasks.named('jacocoTestReport')
}

def centralStagingRoot = layout.buildDirectory.dir('central-staging-repo')

def stageCentralBundleRepo = tasks.register('stageCentralBundleRepo', Sync) {
    dependsOn tasks.named('publishToMavenLocal')
    into(centralStagingRoot)

    publishing.publications.withType(MavenPublication).all { publication ->
        def publicationPath = "${publication.groupId.replace('.', '/')}/${publication.artifactId}/${publication.version}"
        from(file("${System.getProperty('user.home')}/.m2/repository/${publicationPath}")) {
            into(publicationPath)
        }
    }

    doFirst {
        publishing.publications.withType(MavenPublication).each { publication ->
            def publicationPath = "${publication.groupId.replace('.', '/')}/${publication.artifactId}/${publication.version}"
            def localPublicationDir = file("${System.getProperty('user.home')}/.m2/repository/${publicationPath}")
            if (!localPublicationDir.exists()) {
                throw new GradleException("Expected local Maven publication directory not found: ${localPublicationDir}")
            }
        }
    }
}

def generateCentralBundleChecksums = tasks.register('generateCentralBundleChecksums') {
    dependsOn stageCentralBundleRepo
    notCompatibleWithConfigurationCache('Generates checksum files by scanning staged output directory at execution time.')
    doLast {
        def stagedRepoDir = centralStagingRoot.get().asFile
        if (!stagedRepoDir.exists()) {
            throw new GradleException("Expected staged repository directory not found: ${stagedRepoDir}")
        }
        def checksum = { File input, String algorithm ->
            MessageDigest digest = MessageDigest.getInstance(algorithm)
            input.withInputStream { stream ->
                byte[] buffer = new byte[8192]
                int read
                while ((read = stream.read(buffer)) >= 0) {
                    digest.update(buffer, 0, read)
                }
            }
            digest.digest().collect { String.format('%02x', it & 0xff) }.join('')
        }
        stagedRepoDir.eachFileRecurse { file ->
            if (file.isFile() && !file.name.endsWith('.md5') && !file.name.endsWith('.sha1')) {
                file.parentFile.toPath().resolve(file.name + '.md5').toFile().text = checksum(file, 'MD5') + System.lineSeparator()
                file.parentFile.toPath().resolve(file.name + '.sha1').toFile().text = checksum(file, 'SHA-1') + System.lineSeparator()
            }
        }
    }
}

tasks.register('packageCentralBundle', Zip) {
    dependsOn generateCentralBundleChecksums
    archiveBaseName = project.name
    archiveVersion = project.version.toString()
    archiveClassifier = 'central-bundle'
    destinationDirectory = layout.buildDirectory.dir('central-bundle').get().asFile
    from layout.buildDirectory.dir('central-staging-repo')
}
